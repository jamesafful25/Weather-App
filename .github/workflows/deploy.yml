
name: Build and Deploy Weather App to AWS EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ALB_CONTROLLER_ROLE_ARN: ${{ vars.ALB_CONTROLLER_ROLE_ARN }}
  ECR_REPOSITORY: weather-app-dev-frontend
  EKS_CLUSTER_NAME: weather-app-dev-eks

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Validate Configuration
      # ==========================================

      - name: Validate deployment configuration
        run: |
          set -euo pipefail

          : "${AWS_REGION:?AWS_REGION variable is missing}"
          : "${AWS_ROLE_ARN:?AWS_ROLE_ARN variable is missing}"
          : "${ALB_CONTROLLER_ROLE_ARN:?ALB_CONTROLLER_ROLE_ARN variable is missing}"
          : "${ECR_REPOSITORY:?ECR_REPOSITORY is missing}"
          : "${EKS_CLUSTER_NAME:?EKS_CLUSTER_NAME is missing}"

          echo "Deployment configuration validated."


      # ==========================================
      # 3. Authenticate with AWS using GitHub OIDC
      # ==========================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity


      # ==========================================
      # 4. Login to Amazon ECR
      # ==========================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================
      # 5. Build and Push Docker Image
      # ==========================================

      - name: Build and push Weather App image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          set -euo pipefail

          docker build \
            --pull \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker tag \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Docker image successfully pushed to ECR."


      # ==========================================
      # 6. Configure Kubernetes Access
      # ==========================================

      - name: Configure kubectl
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl cluster-info


      # ==========================================
      # 7. Install Helm
      # ==========================================

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3


      # ==========================================
      # 8. Retrieve AWS Network Information
      # ==========================================

      - name: Get EKS VPC ID
        run: |
          set -euo pipefail

          VPC_ID=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query "cluster.resourcesVpcConfig.vpcId" \
            --output text)

          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            echo "ERROR: Could not retrieve the EKS VPC ID."
            exit 1
          fi

          echo "VPC_ID=$VPC_ID" >> "$GITHUB_ENV"

          echo "EKS VPC ID retrieved successfully."


      # ==========================================
      # 9. Install AWS Load Balancer Controller
      # ==========================================

      - name: Install AWS Load Balancer Controller
        run: |
          set -euo pipefail

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          helm upgrade --install aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --version 1.14.0 \
            --namespace kube-system \
            --set clusterName="$EKS_CLUSTER_NAME" \
            --set region="$AWS_REGION" \
            --set vpcId="$VPC_ID" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set-string "serviceAccount.annotations.eks\\.amazonaws\\.com/role-arn=$ALB_CONTROLLER_ROLE_ARN" \
            --wait \
            --timeout 10m

          kubectl rollout status deployment/aws-load-balancer-controller \
            --namespace kube-system \
            --timeout=300s

          echo "AWS Load Balancer Controller is ready."


      # ==========================================
      # 10. Prepare Kubernetes Deployment Image
      # ==========================================

      - name: Set application image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          set -euo pipefail

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          sed -i "s|WEATHER_APP_IMAGE|$IMAGE|" k8s/deployment.yaml

          echo "Application image configured successfully."

          grep "image:" k8s/deployment.yaml


      # ==========================================
      # 11. Deploy Kubernetes Manifests
      # ==========================================

      - name: Deploy Kubernetes manifests
        run: |
          set -euo pipefail

          kubectl apply -f k8s/deployment.yaml

          kubectl apply -f k8s/service.yaml

          kubectl apply -f k8s/ingress.yaml

          echo "Kubernetes manifests applied successfully."


      # ==========================================
      # 12. Wait for Application Deployment
      # ==========================================

      - name: Wait for Weather App rollout
        run: |
          set -euo pipefail

          kubectl rollout status deployment/weather-app \
            --namespace default \
            --timeout=300s

          echo "Weather App Deployment is ready."


      # ==========================================
      # 13. Wait for AWS Load Balancer
      # ==========================================

      - name: Wait for ALB public address
        run: |
          set -euo pipefail

          echo "Waiting for AWS to provision the Application Load Balancer..."

          ALB_ADDRESS=""

          for attempt in $(seq 1 60); do

            ALB_ADDRESS=$(kubectl get ingress weather-app-ingress \
              --namespace default \
              --output jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [ -n "$ALB_ADDRESS" ]; then
              break
            fi

            echo "Attempt $attempt of 60: ALB address not available yet."

            sleep 30

          done

          if [ -z "$ALB_ADDRESS" ]; then
            echo "ERROR: ALB address was not assigned within 30 minutes."

            kubectl describe ingress weather-app-ingress \
              --namespace default || true

            exit 1
          fi

          APP_URL="http://$ALB_ADDRESS"

          echo "ALB_ADDRESS=$ALB_ADDRESS" >> "$GITHUB_ENV"
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"

          echo "Application Load Balancer created successfully."
          echo "Weather App URL: $APP_URL"


      # ==========================================
      # 14. Verify Application HTTP Availability
      # ==========================================

      - name: Verify Weather App HTTP response
        run: |
          set -euo pipefail

          echo "Checking application availability..."

          for attempt in $(seq 1 40); do

            if curl --fail --silent --show-error \
              --output /dev/null \
              --connect-timeout 10 \
              --max-time 20 \
              "$APP_URL"; then

              echo "Weather App is responding successfully."
              exit 0
            fi

            echo "Attempt $attempt of 40: Application not ready yet."

            sleep 15

          done

          echo "ERROR: Weather App did not return a successful HTTP response."

          exit 1


      # ==========================================
      # 15. Verify Kubernetes Deployment
      # ==========================================

      - name: Verify Kubernetes deployment
        run: |
          set -euo pipefail

          echo "========== DEPLOYMENTS =========="
          kubectl get deployments

          echo "========== PODS =========="
          kubectl get pods -o wide

          echo "========== SERVICES =========="
          kubectl get services

          echo "========== INGRESS =========="
          kubectl get ingress

          echo "========== APPLICATION URL =========="
          echo "$APP_URL"


      # ==========================================
      # 16. Publish Deployment Summary
      # ==========================================

      - name: Publish Deployment Summary
        if: success()
        run: |
          {
            echo "## Weather App Deployment Successful"
            echo ""
            echo "- **AWS Region:** $AWS_REGION"
            echo "- **EKS Cluster:** $EKS_CLUSTER_NAME"
            echo "- **ECR Repository:** $ECR_REPOSITORY"
            echo "- **Application:** Weather App"
            echo "- **Load Balancer:** $ALB_ADDRESS"
            echo ""
            echo "### Application URL"
            echo "[$APP_URL]($APP_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
