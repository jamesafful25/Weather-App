
apiVersion: apps/v1
kind: Deployment

metadata:
  name: weather-app
  namespace: default

  labels:
    app: weather-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: weather-app

  template:
    metadata:
      labels:
        app: weather-app

    spec:
      containers:
        - name: weather-app

          # GitHub Actions will replace this image with
          # the actual ECR image during deployment.
          image: WEATHER_APP_IMAGE

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 250m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
